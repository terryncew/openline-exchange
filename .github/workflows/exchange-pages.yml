name: Legacy receipt check (manual, no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Legacy structure check only
        run: python scripts/verify_receipt_v12.py
      - name: Validate beta independently
        run: python scripts/validate_beta.py
