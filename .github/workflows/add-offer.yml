name: Prepare legacy offer artifact (manual, no publication)
on:
  workflow_dispatch:
    inputs:
      price_usd:
        description: 'Price for the already-reviewed docs/receipt.latest.json; creates artifact only'
        required: true
      royalty_bps:
        description: 'Creator royalty basis points (0-10000)'
        required: true
        default: '0'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install legacy signature verifier
        run: python -m pip install pynacl
      - name: Prepare reviewed local receipt offer without network fetch
        env:
          PRICE_USD: ${{ inputs.price_usd }}
          ROYALTY_BPS: ${{ inputs.royalty_bps }}
        run: python scripts/add_offer.py --file docs/receipt.latest.json --price "$PRICE_USD" --royalty "$ROYALTY_BPS"
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-offer-for-review
          path: docs/offers
