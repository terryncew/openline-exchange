name: Beta static validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static and model checks (no credentials, publication, or contributed capability execution)
        run: |
          python scripts/validate_beta.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/beta_model.test.mjs
          node --check docs/beta/app.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser driver
        run: python -m pip install -r tests/requirements-browser.txt
      - name: Validate full browser journey without external requests
        run: python tests/browser_beta.py --chromium /usr/bin/google-chrome --screenshots-dir /tmp/beta-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: beta-review-screenshots
          path: /tmp/beta-screenshots
