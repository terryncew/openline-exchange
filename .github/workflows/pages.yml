name: Review and deploy Exchange Pages (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: olx-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail closed on beta artifacts
        run: |
          python scripts/validate_beta.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/beta_model.test.mjs
      - name: Install pinned browser driver
        run: python -m pip install -r tests/requirements-browser.txt
      - name: Validate public journey before approved publication
        run: python tests/browser_beta.py --chromium /usr/bin/google-chrome
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/beta
  deploy:
    permissions:
      pages: write
      id-token: write
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
